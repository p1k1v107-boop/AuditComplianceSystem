{% extends "base.html" %}
{% block title %}{{ judul_halaman }} - Sistem Audit{% endblock %}
{% block content %}
<div class="page-header">
    <div><a href="/audit/auditor/daftar" class="btn btn-ghost btn-sm mb-2">← Kembali</a><h2>{{ judul_halaman }}</h2></div>
</div>
<div class="card form-card">
    <div class="card-body">
        <form method="post" action="/audit/auditor/tambah" id="formAuditor">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="nama" class="form-label">Nama <span class="required">*</span></label>
                    <input type="text" id="nama" name="nama" class="form-input" required placeholder="Nama lengkap auditor">
                </div>
                <div class="form-group">
                    <label for="jabatan" class="form-label">Jabatan <span class="required">*</span></label>
                    <input type="text" id="jabatan" name="jabatan" class="form-input" required placeholder="Contoh: Auditor Senior">
                </div>
                <div class="form-group">
                    <label for="sertifikasi" class="form-label">Sertifikasi</label>
                    <input type="text" id="sertifikasi" name="sertifikasi" class="form-input" placeholder="Contoh: CIA, CISA">
                </div>
            </div>
            <div class="form-actions">
                <a href="/audit/auditor/daftar" class="btn btn-ghost">Batal</a>
                <button type="submit" class="btn btn-primary" id="btnSimpanAuditor">Simpan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
